version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inx_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: the_last_request
    ports:
      - "5432:5432"
    volumes:
      - inx_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d the_last_request"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  inx_pgdata:
    driver: local
